# Builds the Windows installer from this repository's source and attaches it to a draft GitHub
# release tagged v<version> (the version in src-tauri/tauri.conf.json), at the commit it was built
# from. The installer gets a signed build-provenance attestation, and its SHA-256 goes into the
# release notes, so anyone can check that a download is exactly what this workflow built from
# this source. Run it by hand from the Actions tab; review the draft, then publish it.
#
# The installer is also signed with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD), and latest.json goes up with it: installed copies check
# releases/latest/download/latest.json and install only what that key signed. Publishing the
# draft is what ships the update.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.4.1

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # The reader and tracker tests (they read the fixtures in src-tauri/tests/fixtures).
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The patch notes (patch-notes.json): this version must have exactly one entry. The last 15
      # versions' notes, as JSON, are latest.json's notes, for the app to show what changed between
      # the user's version and this one (updater.rs); this version's, as text, start the release page.
      - id: notes
        name: Patch notes
        shell: pwsh
        run: |
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $all = Get-Content -Raw patch-notes.json | ConvertFrom-Json
          $this = @($all.versions | Where-Object { $_.version -eq $version })
          if ($this.Count -ne 1) { throw "patch-notes.json needs exactly one entry for $version, found $($this.Count)" }
          if ($all.versions[0].version -ne $version) { throw "patch-notes.json's newest entry is $($all.versions[0].version), not $version" }
          $json = ConvertTo-Json -InputObject ([ordered]@{ versions = @($all.versions | Select-Object -First 15) }) -Depth 6 -Compress
          Set-Content -Path patch-notes.min.json -Value $json -Encoding utf8NoBOM -NoNewline
          $delimiter = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "json<<$delimiter`n$json`n$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $sections = [ordered]@{ new = 'New'; convenience = 'Convenience'; technical = 'Accuracy & performance'; fixes = 'Fixes' }
          $md = @("## What's new in v$version", '')
          foreach ($key in $sections.Keys) {
            $items = @($this[0].$key | Where-Object { $_ })
            if ($items.Count -gt 0) { $md += "### $($sections[$key])"; $md += $items | ForEach-Object { "- $_" }; $md += '' }
          }
          Set-Content -Path patch-notes.md -Value ($md -join "`n") -Encoding utf8NoBOM

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Classic EXP Tracker v__VERSION__
          releaseBody: ${{ steps.notes.outputs.json }}
          releaseDraft: true
          prerelease: false

      # Signed (Sigstore) provenance: this file, by this workflow, from this commit.
      - uses: actions/attest@v4
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*-setup.exe

      # The notes name the file as GitHub stores it (it turns spaces into dots), and the run fails
      # unless exactly the installer, its updater signature and latest.json were uploaded, GitHub's
      # digest of the installer is the hash of the file built and attested above, and every
      # Windows entry in latest.json is this version's installer with that signature.
      - name: Check the upload; release notes with the installer's SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          $installers = @(Get-Item src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "expected one installer, found $($installers.Count)" }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash   # uppercase, as Get-FileHash shows it to users
          $signature = (Get-Content -Raw "$($installers[0].FullName).sig").Trim()
          if (-not $signature) { throw "no updater signature next to the installer: are the signing secrets set?" }
          $assets = @(gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --jq '.assets' | ConvertFrom-Json)
          $asset = @($assets | Where-Object { $_.name -like '*-setup.exe' })
          $others = (@($assets | Where-Object { $_.name -notlike '*-setup.exe' } | ForEach-Object name | Sort-Object) -join ',')
          if ($asset.Count -ne 1 -or $others -ne ((@("$($asset[0].name).sig", 'latest.json') | Sort-Object) -join ',')) {
            throw "expected the installer, its .sig and latest.json on the release, found: $($assets.name -join ', ')"
          }
          $asset = $asset[0]
          if ($asset.digest -ne "sha256:$($hash.ToLowerInvariant())") { throw "uploaded $($asset.name) has digest $($asset.digest), built file has sha256:$hash" }
          $name = $asset.name
          # A draft's files download through the API (by asset id), not by the tag's URL.
          foreach ($file in @("$name.sig", 'latest.json')) {
            $id = ($assets | Where-Object name -eq $file).id
            gh api "repos/$env:GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "uploaded-$file"
            if ($LASTEXITCODE -ne 0) { throw "could not download the uploaded $file" }
          }
          if ((Get-Content -Raw "uploaded-$name.sig").Trim() -ne $signature) { throw "uploaded $name.sig isn't the signature built here" }
          $latest = Get-Content -Raw uploaded-latest.json | ConvertFrom-Json
          if ($latest.version -ne $env:VERSION) { throw "latest.json announces $($latest.version), building $env:VERSION" }
          if ($latest.notes -ne (Get-Content -Raw patch-notes.min.json)) { throw "latest.json's notes aren't the patch notes" }
          $windows = @($latest.platforms.PSObject.Properties | Where-Object Name -like 'windows-*')
          if ($windows.Count -eq 0) { throw "latest.json has no Windows entry" }
          foreach ($entry in $windows) {
            if ($entry.Value.signature.Trim() -ne $signature) { throw "latest.json $($entry.Name) has another signature" }
            # tauri-action links the asset by its API URL; the updater downloads it as octet-stream.
            if ($entry.Value.url -ne $asset.url) { throw "latest.json $($entry.Name) points at $($entry.Value.url), not $name ($($asset.url))" }
          }
          $run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $commit = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA"
          $body = (Get-Content -Raw patch-notes.md) + "`n" + @"
          Windows 10 (2004 or later) or 11, 64-bit. Download ``$name`` below and run it; see the [README](https://github.com/$env:GITHUB_REPOSITORY#install) for setup. The installer isn't code-signed, so SmartScreen may warn: choose **More info**, then **Run anyway**.

          ### Built from this source

          This installer was built by the [Release workflow]($run) from commit [``$env:GITHUB_SHA``]($commit). The only other files are its update signature and ``latest.json``, for the app's own update check.

          **SHA-256:** ``$hash``

          To check your download, in PowerShell in the folder you saved it to:

          ``````powershell
          (Get-FileHash '.\$name' -Algorithm SHA256).Hash   # matches the SHA-256 above
          gh attestation verify '.\$name' --repo $env:GITHUB_REPOSITORY   # GitHub's signed record that this workflow built it from this repo
          ``````
          "@
          Set-Content -Path release-notes.md -Value $body -Encoding utf8NoBOM
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F "body=@release-notes.md" -f "tag_name=v$env:VERSION" -f "target_commitish=$env:GITHUB_SHA" --silent
          "Installer: $name  SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
