[package]
name = "classic-exp-tracker"
version = "0.11.0"
description = "MapleStory Classic World EXP tracker"
authors = ["Kwuasimoto"]
license = "MIT"
repository = "https://github.com/Kwuasimoto/classic-exp-tracker"
publish = false
edition = "2024"
default-run = "classic-exp-tracker"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "classic_exp_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "2.0.1"
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization", "Win32_Security", "Win32_Security_Credentials"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.34"
tauri-plugin-log = "2.10.1"
tauri-plugin-single-instance = "2"
# Only for the chat translator's downloads (translator.rs), with Windows' own TLS.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
sha2 = "0.10.9"
tokio = { version = "1", features = ["time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[features]
dev-tools = []

[[bin]]
name = "glyph-collect"
path = "src/bin/glyph_collect.rs"
required-features = ["dev-tools"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
